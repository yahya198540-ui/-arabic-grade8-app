<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>مغامرة العطف في الفضاء</title>
<style>
:root{--cy:#6ee7ff;--cy2:#2fb8e6;--amber:#ffb84d;--red:#ff4d6d;--green:#3ddc97;--ink:#050914;--glass:rgba(8,14,32,.58);--line:rgba(110,231,255,.38);
 --font:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#eaf6ff;font-family:var(--font);user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font-family:inherit}

/* ===== HUD ===== */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.glass{background:var(--glass);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 30px rgba(110,231,255,.08) inset,0 8px 30px rgba(0,0,0,.35)}
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hb{padding:7px 12px;display:flex;align-items:center;gap:10px;font-size:clamp(12px,1.6vw,15px);font-weight:700;letter-spacing:.2px;white-space:nowrap}
.hb small{opacity:.65;font-weight:600;font-size:.82em}
#shield{display:flex;gap:4px}#shield i{width:20px;height:9px;border-radius:2px;background:rgba(255,255,255,.14);transform:skewX(-18deg);transition:.25s}
#shield i.on{background:linear-gradient(90deg,var(--cy2),var(--cy));box-shadow:0 0 10px var(--cy)}
#shield.low i.on{background:linear-gradient(90deg,#ff2d55,#ff7a45);box-shadow:0 0 10px #ff4d6d}
#track{display:flex;align-items:center;gap:0;direction:ltr}
.nd{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);margin:0 3px;position:relative;transition:.3s}
.nd.done{background:var(--amber);border-color:#ffe3a8;box-shadow:0 0 12px var(--amber)}
.nd.cur{border-color:var(--cy);box-shadow:0 0 12px var(--cy);animation:pl 1.2s infinite}
.sep{width:2px;height:16px;background:rgba(255,255,255,.35);margin:0 7px;border-radius:2px}
@keyframes pl{50%{transform:scale(1.35)}}
#kcells{display:flex;gap:3px;direction:ltr}#kcells i{width:9px;height:20px;border-radius:2px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);transition:.4s}
#kcells i.on{background:linear-gradient(#fff3b0,var(--amber));border-color:#fff;box-shadow:0 0 10px var(--amber)}
#kcells i.pop{animation:kp .9s}
@keyframes kp{30%{transform:scale(1.9,1.5)}}
.ib{pointer-events:auto;cursor:pointer;color:#fff;background:var(--glass);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;font-size:16px;backdrop-filter:blur(10px)}
.ib:hover{border-color:var(--cy)}
#bl{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:12px;opacity:.8;line-height:1.6;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
#warns .w{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;background:rgba(255,40,70,.85);clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:10px;font-size:15px;animation:wb .35s infinite alternate;filter:drop-shadow(0 0 8px #ff2a46)}
@keyframes wb{to{opacity:.35}}
#hint{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);font-size:clamp(13px,2vw,17px);padding:8px 18px;font-weight:700;opacity:0;transition:opacity .6s;text-align:center}
#hint.show{opacity:.95}

/* ===== شاشات ===== */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;overflow:auto}
.card{max-width:680px;width:100%;padding:26px 28px;text-align:center;border-radius:26px;background:linear-gradient(160deg,rgba(14,26,56,.78),rgba(6,10,26,.82));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 0 80px rgba(70,160,255,.18),0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset}
.eyebrow{font-size:13px;letter-spacing:3px;color:var(--cy);font-weight:700;opacity:.9}
h1{margin:6px 0 6px;font-size:clamp(30px,6.4vw,56px);font-weight:900;line-height:1.15;background:linear-gradient(180deg,#fff,#9fdcff 60%,#5aa7ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(90,170,255,.45))}
.card p{margin:8px 0;font-size:clamp(14px,2.3vw,18px);line-height:1.9;color:#cfe6ff;font-weight:500}
.btn{cursor:pointer;border:0;border-radius:16px;padding:13px 34px;margin:8px 5px 2px;font-size:clamp(16px,2.8vw,20px);font-weight:800;color:#04101f;background:linear-gradient(135deg,#bff3ff,var(--cy) 50%,#59b6ff);box-shadow:0 10px 30px rgba(80,190,255,.45),0 0 0 1px rgba(255,255,255,.4) inset;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(80,190,255,.6),0 0 0 1px rgba(255,255,255,.5) inset}
.btn.alt{background:linear-gradient(135deg,#ffe7b8,var(--amber));box-shadow:0 10px 30px rgba(255,170,60,.4),0 0 0 1px rgba(255,255,255,.4) inset}
.tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}.tips span{font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
#loading{background:#02040c;z-index:60;flex-direction:column;gap:16px;font-size:18px;letter-spacing:1px}
#loading .bar{width:min(320px,70vw);height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}#loading .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--cy2),var(--cy));animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}

/* ===== سينمائي ===== */
#bars div{position:fixed;left:0;right:0;height:0;background:#000;z-index:12;transition:height 1.1s cubic-bezier(.6,0,.2,1)}#bars .t{top:0}#bars .b{bottom:0}#bars.on div{height:11vh}
#cine{position:fixed;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 16px}
#cine .k{font-size:clamp(13px,2.4vw,20px);font-weight:700;letter-spacing:6px;color:var(--cy);opacity:0;text-shadow:0 0 18px var(--cy)}
#cine .t{font-size:clamp(34px,8.5vw,92px);font-weight:900;opacity:0;line-height:1.15;margin:6px 0;background:linear-gradient(180deg,#fff,#a8dcff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(120,190,255,.55));letter-spacing:1px}
#cine .s{font-size:clamp(14px,2.4vw,22px);font-weight:500;color:var(--amber);opacity:0}
#cine.show .k{animation:fi 1s .1s forwards}#cine.show .t{animation:ti 1.2s .35s forwards}#cine.show .s{animation:fi 1s 1.1s forwards}
@keyframes fi{to{opacity:1}}@keyframes ti{from{transform:translateY(16px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:drop-shadow(0 6px 24px rgba(120,190,255,.55))}}
#count{position:fixed;inset:0;z-index:13;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(90px,26vw,260px);font-weight:900;color:#fff;text-shadow:0 0 60px rgba(110,231,255,.8)}
#count.pop{animation:cp 1s}@keyframes cp{0%{transform:scale(1.8);opacity:0}20%{opacity:1}100%{transform:scale(.85);opacity:0}}
#crash{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:14;pointer-events:none}
#crash div{padding:14px 26px;border-radius:16px;font-weight:800;font-size:clamp(16px,3vw,24px);background:rgba(120,10,30,.8);border:1px solid #ff6b86;box-shadow:0 0 50px rgba(255,40,80,.5);animation:sh .5s;text-align:center}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== حاسوب المركبة ===== */
#frame{position:fixed;inset:0;z-index:9;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(0,5,20,.7);animation:fi .6s}
#qwrap{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 12px max(10px,env(safe-area-inset-bottom));pointer-events:none;animation:qr .7s cubic-bezier(.2,1,.3,1)}
@keyframes qr{from{transform:translateY(70%);opacity:0}}
#term{pointer-events:auto;width:min(760px,100%);max-height:70vh;overflow:auto;position:relative;padding:12px 18px 12px;border-radius:22px 22px 12px 12px;
 background:linear-gradient(180deg,rgba(14,34,70,.82),rgba(6,12,30,.9));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--cy);
 box-shadow:0 0 0 4px rgba(4,10,24,.9),0 0 0 5px rgba(110,231,255,.35),0 -10px 70px rgba(80,190,255,.35),0 0 60px rgba(110,231,255,.12) inset;transform:perspective(1100px) rotateX(5deg);transform-origin:50% 100%}
#term::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(150,220,255,.04) 0 1px,transparent 1px 4px)}
#term::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(110,231,255,.09),transparent);animation:scan 4.5s linear infinite}
@keyframes scan{to{top:110%}}
#qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(11px,1.7vw,14px);font-weight:700;color:var(--cy);letter-spacing:.4px}
#qhead .tg{padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(110,231,255,.08)}
#hintBtn{cursor:pointer;color:var(--amber);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.5);border-radius:999px;padding:3px 14px;font-size:inherit;font-weight:700}
#sentence{margin:8px 0 3px;padding:8px 14px;border-radius:14px;text-align:center;font-size:clamp(21px,4.4vw,34px);font-weight:800;line-height:1.7;color:#fff;background:linear-gradient(90deg,rgba(110,231,255,.05),rgba(110,231,255,.18),rgba(110,231,255,.05));border:1px solid rgba(110,231,255,.3);text-shadow:0 0 18px rgba(110,231,255,.5)}
#qprompt{text-align:center;font-size:clamp(14px,2.4vw,19px);font-weight:600;color:#cfe6ff;margin:3px 0 7px}
#opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;cursor:pointer;text-align:right;padding:6px 14px;font-size:clamp(17px,3vw,24px);font-weight:800;color:#f0faff;border-radius:14px;border:1px solid rgba(110,231,255,.45);background:linear-gradient(90deg,rgba(40,120,200,.28),rgba(20,60,120,.35));box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 4px 0 rgba(8,30,70,.9),0 0 22px rgba(80,180,255,.12);transition:.14s}
.opt .lt{width:34px;height:34px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(110,231,255,.16);border:1px solid rgba(110,231,255,.55);color:var(--cy);font-size:18px}
.opt:hover{transform:translateY(-2px);border-color:#fff;background:linear-gradient(90deg,rgba(60,150,230,.45),rgba(30,80,150,.5));box-shadow:0 0 0 1px rgba(0,0,0,.4) inset,0 6px 0 rgba(8,30,70,.9),0 0 30px rgba(110,231,255,.4)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(8,30,70,.9)}
.opt.good{background:linear-gradient(90deg,rgba(30,180,120,.55),rgba(20,110,80,.55))!important;border-color:#8dffc8!important;box-shadow:0 0 40px rgba(61,220,151,.6)!important;animation:gp .6s}.opt.good .lt{background:#3ddc97;color:#04210f;border-color:#fff}
.opt.bad{background:linear-gradient(90deg,rgba(200,40,70,.5),rgba(120,20,40,.5))!important;border-color:#ff8da1!important;animation:sh .45s}.opt.bad .lt{background:#ff4d6d;color:#fff;border-color:#fff}
.opt.lock{pointer-events:none}@keyframes gp{40%{transform:scale(1.04)}}
#fb{min-height:46px;margin:8px 0 0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(13px,2.2vw,17px);line-height:1.6;padding:2px 8px;border-radius:12px}
#fb.good{color:#b5ffd9;background:rgba(61,220,151,.1)}#fb.bad{color:#ffd0d8;background:rgba(255,77,109,.12)}#fb.hint{color:#ffe0a8;background:rgba(255,184,77,.09)}
@media(max-height:560px){#term{max-height:80vh;padding:6px 12px}#sentence{margin:4px 0;padding:3px 10px}.opt{padding:3px 12px}#opts{gap:5px}}

/* ===== النتيجة ===== */
.ring{position:relative;width:170px;height:170px;margin:6px auto}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff;text-shadow:0 0 22px rgba(110,231,255,.7)}
.rows{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.rows div{padding:5px;border-radius:10px;font-weight:700;font-size:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}.rows .ok{border-color:#3ddc97;background:rgba(61,220,151,.12)}.rows .no{border-color:#ffb84d;background:rgba(255,184,77,.1)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:11}
@media(max-width:640px){#top{flex-wrap:wrap}.hb .lb{display:none}#bl{display:none}}

/* ===== الواجهة الافتتاحية (كرتونية متحركة) ===== */
#start{padding:0;overflow:hidden;display:block;background:linear-gradient(180deg,#2b1a8f 0%,#5a35c9 38%,#ff7ac8 78%,#ffc27a 100%);transition:opacity .9s}
#start.out{opacity:0;pointer-events:none}
#start .sky{position:absolute;inset:0;overflow:hidden}
#start .st{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;animation:tw 2.4s infinite ease-in-out}
@keyframes tw{50%{opacity:.15;transform:scale(.4)}}
.pl{position:absolute;border-radius:50%;border:6px solid #2a1b5a;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(4deg)}}
.pl1{width:19vmin;height:19vmin;left:6%;top:14%;background:radial-gradient(circle at 32% 28%,#ffe08a 0 10%,#ffa630 40%,#ff6b2c 100%);box-shadow:inset -14px -14px 0 rgba(120,30,0,.25)}
.pl1::before,.pl1::after{content:"";position:absolute;border-radius:50%;background:rgba(160,50,0,.28);border:4px solid #2a1b5a}.pl1::before{width:22%;height:22%;left:56%;top:58%}.pl1::after{width:14%;height:14%;left:22%;top:62%}
.pl2{width:12vmin;height:12vmin;right:8%;top:10%;background:radial-gradient(circle at 30% 28%,#c8fff0 0 8%,#3ddc97 45%,#14a37a 100%);animation-delay:-2s;box-shadow:inset -10px -10px 0 rgba(0,70,50,.25)}
.pl2 i{position:absolute;left:-50%;top:30%;width:200%;height:40%;border:6px solid #2a1b5a;border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 0 6px #ffd23f inset;pointer-events:none}
.pl3{width:8vmin;height:8vmin;left:20%;top:48%;background:radial-gradient(circle at 30% 28%,#d6e8ff 0 8%,#59a9ff 50%,#2a5fe0 100%);animation-delay:-4s}
.pl4{width:14vmin;height:14vmin;right:20%;top:30%;background:radial-gradient(circle at 32% 28%,#fff 0 8%,#ffd0ea 40%,#ff8dc4 100%);animation-delay:-1s}
.pl4 b{position:absolute;background:#2a1b5a;border-radius:50%}.pl4 .e1{width:9%;height:13%;left:32%;top:36%}.pl4 .e2{width:9%;height:13%;left:60%;top:36%}.pl4 .mo{width:30%;height:14%;left:35%;top:58%;background:none;border-bottom:5px solid #2a1b5a;border-radius:0 0 60px 60px}
.shoot{position:absolute;width:140px;height:5px;border-radius:5px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(28deg);opacity:0;animation:sh 6s infinite}
.shoot.s1{left:10%;top:6%}.shoot.s2{left:55%;top:2%;animation-delay:3s}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(28deg)}6%{opacity:1}22%{opacity:0;transform:translate(360px,200px) rotate(28deg)}100%{opacity:0}}
#scene{position:absolute;left:0;right:0;bottom:11vh;width:100%;height:calc(100% - 11vh);overflow:visible;pointer-events:none}
#rocketLift{transition:transform 2.4s cubic-bezier(.5,0,.9,.4)}
#start.go #rocketLift{transform:translateY(-1500px)}
#start.go #flame{opacity:1;transition:opacity .2s}#start.go #puffs{opacity:0;transition:opacity .3s}
#start.go #boy{animation:jump .6s ease-out}@keyframes jump{40%{transform:translateY(-60px)}}
#start.go #bubble{opacity:0;transition:opacity .3s}
#rocketLift{animation:idle 2.6s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-4px) rotate(.4deg)}}
#start.go #rocketLift{animation:none}
#titleBlock{position:absolute;left:0;right:0;top:max(3vh,12px);text-align:center;padding:0 12px;pointer-events:none}
#titleBlock .eyebrow{font-size:clamp(12px,2vw,17px);color:#fff;letter-spacing:2px;font-weight:800;text-shadow:0 2px 0 #2a1b5a}
#titleBlock h1{font-size:clamp(34px,8vw,84px);margin:2px 0;font-weight:900;line-height:1.1;background:none;-webkit-background-clip:initial;background-clip:initial;color:#ffd23f;filter:none;-webkit-text-stroke:clamp(6px,1.2vw,14px) #2a1b5a;paint-order:stroke fill;text-shadow:0 clamp(4px,.8vw,9px) 0 #2a1b5a;animation:ttl 3s ease-in-out infinite}
@keyframes ttl{50%{transform:translateY(-6px) rotate(-.6deg)}}
#start #startBtns{position:absolute;left:0;right:0;bottom:max(3.2vh,10px);text-align:center;z-index:3}
#start .go{cursor:pointer;border:6px solid #2a1b5a;border-radius:28px;padding:8px clamp(24px,4vw,44px);margin:0 6px;font-size:clamp(18px,3vw,28px);font-weight:900;color:#2a1b5a;background:linear-gradient(#fff3a0,#ffc928);box-shadow:0 9px 0 #b9770a,0 18px 30px rgba(0,0,0,.35);animation:bn 1.4s ease-in-out infinite;transition:transform .08s}
#start .go.alt{background:linear-gradient(#b9f5ff,#41d3ff);box-shadow:0 9px 0 #1b86a8,0 18px 30px rgba(0,0,0,.35);animation-delay:.3s}
#start .go:active{transform:translateY(7px);box-shadow:0 2px 0 #b9770a}
@keyframes bn{50%{transform:scale(1.06)}}
#start .tips{display:none;position:absolute;left:0;right:0;bottom:1.2vh;margin:0;z-index:3}#start .tips span{background:rgba(42,27,90,.55);border:0;color:#fff;font-weight:700;font-size:12px}
@media(max-width:700px){#start .tips{display:none}}

/* ===== أسلوب كرتوني موحّد (HUD + حاسوب المركبة) ===== */
:root{--ink:#2a1b5a}
.glass{background:linear-gradient(#7a56e8,#5a38c4);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 #1a0f3e;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff}
.hb{font-weight:900;text-shadow:0 2px 0 var(--ink)}
#shield i{height:12px;border-radius:6px;transform:none;background:rgba(0,0,0,.25);border:2px solid var(--ink)}
#shield i.on{background:linear-gradient(#ff9ab8,#ff3d71);box-shadow:none}
#shield.low i.on{background:linear-gradient(#ffd27a,#ff7a1a);animation:pl .6s infinite}
.nd{border:3px solid var(--ink);background:#c9b8ff}.nd.done{background:#ffd23f;box-shadow:0 0 0 2px #fff6a8 inset}.nd.cur{background:#5eead4;box-shadow:none}
.sep{background:var(--ink)}
#kcells i{border:2px solid var(--ink);background:#c9b8ff;border-radius:4px}#kcells i.on{background:linear-gradient(#fff3a0,#ffc928);box-shadow:none}
.ib{background:linear-gradient(#7a56e8,#5a38c4);border:4px solid var(--ink);box-shadow:0 5px 0 #1a0f3e;border-radius:14px}
#warns .w{background:#ff3d71;filter:drop-shadow(0 3px 0 var(--ink))}
#hint{font-weight:800}
/* حاسوب المركبة */
#frame{box-shadow:inset 0 0 0 10px var(--ink),inset 0 0 0 16px #7a56e8,inset 0 -120px 120px -60px rgba(40,10,100,.5)}
#term{background:linear-gradient(180deg,#8d6bff,#5a38c4);border:6px solid var(--ink);border-radius:28px 28px 14px 14px;box-shadow:0 8px 0 #1a0f3e,0 -6px 40px rgba(255,255,255,.18);backdrop-filter:none;transform:perspective(1000px) rotateX(4deg)}
#term::before{background:none}#term::after{display:none}
#qhead{color:#fff;font-weight:900;text-shadow:0 2px 0 var(--ink)}#qhead .tg{background:var(--ink);border:0;color:#ffe27a}
#hintBtn{background:#ffd23f;color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 #b9770a;font-weight:900}
